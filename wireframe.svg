<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2250" viewBox="0 0 1600 2250" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe do aplicativo de controle financeiro pessoal</title>
  <desc id="desc">Esboço visual com dashboard, gráficos, tabelas de contas, investimentos, dívidas, movimentações e ações de exportação.</desc>
