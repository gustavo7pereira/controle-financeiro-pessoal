    .label { font: 700 13px Arial, sans-serif; fill: #5b6472; text-transform: uppercase; }
    .text { font: 14px Arial, sans-serif; fill: #2f3542; }
    .small { font: 12px Arial, sans-serif; fill: #5b6472; }
